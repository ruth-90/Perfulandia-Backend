# Nombre del microservicio
spring.application.name=producto-service

# Puerto del microservicio de productos
server.port=8081

# Base de datos H2 persistente
spring.datasource.url=jdbc:h2:file:./data/productos-db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracion JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.path=/h2-console

# Permite cargar los 12 perfumes originales al iniciar Spring Boot.
# Los 12 perfumes iniciales ya fueron cargados en H2.
# Desactivamos la carga para evitar recrear productos eliminados.
app.seed.enabled= false

# PERFULANDIA - EUREKA DISCOVERY CLIENT
# Direccion del servidor Eureka en desarrollo local.
# Permite registrar producto-service automaticamente.
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

spring.profiles.default=dev
