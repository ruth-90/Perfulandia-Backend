# SERVIDOR DE DESCUBRIMIENTO DE MICROSERVICIOS

# Nombre del servidor de descubrimiento
spring.application.name=eureka-server

# Puerto donde funcionara Eureka
server.port=8761

# Eureka Server no necesita registrarse a si mismo
eureka.client.register-with-eureka=false

# No necesita consultar otro registro Eureka
eureka.client.fetch-registry=false

spring.profiles.default=dev
