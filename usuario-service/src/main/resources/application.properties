

# CONFIGURACION SPRING BOOT + H2

spring.application.name=usuario-service

# PUERTO DEL MICROSERVICIO
server.port=8082

# BASE DE DATOS H2 PERSISTENTE
spring.datasource.url=jdbc:h2:file:./data/usuarios-db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# CONFIGURACION JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# CONSOLA H2 PARA DESARROLLO LOCAL
spring.h2.console.path=/h2-console

# Direccion de Eureka Server en desarrollo local
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}



# =====================================
# ADMINISTRADOR DE PRUEBA
# =====================================

# Habilitar cuentas de demostracion
app.demo.admin.enabled=${PERFULANDIA_ADMIN_ENABLED:false}

# Restablecer temporalmente la contraseña
app.demo.admin.reset-password=false

# Contraseña definida desde una variable de entorno
app.demo.admin.password=${PERFULANDIA_ADMIN_PASSWORD:}

spring.profiles.default=dev
