

# CONFIGURACION SPRING BOOT + H2

spring.application.name=usuario-service

# PUERTO DEL MICROSERVICIO
server.port=8082

# BASE DE DATOS H2 PERSISTENTE
spring.datasource.url=jdbc:h2:file:./data/usuarios-db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# CONFIGURACION JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# CONSOLA H2 PARA DESARROLLO LOCAL
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console




# JWT - Clave de demostracion para desarrollo local.
# Si existe PERFULANDIA_JWT_SECRET, se utiliza esa variable.
# De lo contrario, se utiliza la clave didactica.
# IMPORTANTE: cambiarla antes de publicar el proyecto.
app.jwt.secret=${PERFULANDIA_JWT_SECRET:ClaveDidacticaPerfulandiaSoloParaPruebasLocales2026}

