# Nombre del servicio
spring.application.name=api-gateway

# Puerto de entrada para las solicitudes
server.port=8080

# Conexion local con Eureka Server
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# ============================================
# RUTAS DE LOS MICROSERVICIOS
# ============================================

# PRODUCTOS - Puerto interno 8081
spring.cloud.gateway.server.webflux.routes[0].id=ruta-productos
spring.cloud.gateway.server.webflux.routes[0].uri=lb://producto-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/productos/**

# USUARIOS - Puerto interno 8082
spring.cloud.gateway.server.webflux.routes[1].id=ruta-usuarios
spring.cloud.gateway.server.webflux.routes[1].uri=lb://usuario-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/usuarios/**

# AUTENTICACION - Usuario-service
spring.cloud.gateway.server.webflux.routes[2].id=ruta-autenticacion
spring.cloud.gateway.server.webflux.routes[2].uri=lb://usuario-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/auth/**

# ADMINISTRACION - Usuario-service
spring.cloud.gateway.server.webflux.routes[3].id=ruta-administracion
spring.cloud.gateway.server.webflux.routes[3].uri=lb://usuario-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/admin/**

# CONTACTO - Puerto interno 8084
spring.cloud.gateway.server.webflux.routes[4].id=ruta-contacto
spring.cloud.gateway.server.webflux.routes[4].uri=lb://contacto-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/contactos,/api/v1/contactos/**


# PEDIDOS - Puerto interno 8083
spring.cloud.gateway.server.webflux.routes[5].id=ruta-pedidos
spring.cloud.gateway.server.webflux.routes[5].uri=lb://pedido-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/v1/pedidos,/api/v1/pedidos/**

# CORS para React
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/api/v1/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/api/v1/**].allowed-headers=Content-Type,Authorization
spring.cloud.gateway.server.webflux.default-filters[0]=RemoveRequestHeader=Origin

spring.profiles.default=dev
