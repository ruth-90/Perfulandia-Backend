
# Nombre del microservicio
spring.application.name=contacto-service

# Puerto exclusivo para Contacto
server.port=8084

# Base de datos H2 persistente para mensajes
spring.datasource.url=jdbc:h2:file:./data/contactos-db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracion JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Consola H2 para desarrollo
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
