
# Nombre del microservicio
spring.application.name=contacto-service

# Puerto exclusivo para Contacto
server.port=8084

# Base de datos H2 persistente para mensajes
spring.datasource.url=jdbc:h2:file:./data/contactos-db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracion JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.path=/h2-console

# EUREKA - REGISTRO DEL MICROSERVICIO
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

spring.profiles.default=dev
