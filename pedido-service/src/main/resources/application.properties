
# =====================================
# PERFULANDIA - PEDIDO SERVICE
# =====================================

spring.application.name=pedido-service

# Puerto de Polette
server.port=8083

# =====================================
# BASE DE DATOS H2
# =====================================

spring.datasource.url=jdbc:h2:file:./data/pedidos-db;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracion JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# =====================================
# MICROSERVICIO DE PRODUCTOS - RUTH
# =====================================

app.productos.url=${PRODUCTOS_URL:http://localhost:8081}

# =====================================
# MONITOREO
# =====================================

management.endpoints.web.exposure.include=health

# =====================================
# REGISTRO EN EUREKA SERVER
# =====================================

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}


# =====================================
# =====================================

spring.profiles.default=dev
