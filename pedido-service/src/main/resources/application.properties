
# =====================================
# PERFULANDIA - PEDIDO SERVICE
# =====================================

spring.application.name=pedido-service

# Puerto de Polette
server.port=8083

# =====================================
# BASE DE DATOS H2
# =====================================

spring.datasource.url=jdbc:h2:file:./data/pedidos-db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracion JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# =====================================
# MICROSERVICIO DE PRODUCTOS - RUTH
# =====================================

app.productos.url=${PRODUCTOS_URL:http://host.docker.internal:8081}

# =====================================
# MONITOREO
# =====================================

management.endpoints.web.exposure.include=health
