spring.application.name=pedido-service

spring.application.name=pedido-service

x   
server.port=8083

# Base de datos H2 persistente
spring.datasource.url=jdbc:h2:file:./data/pedidos-db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Tablas administradas por JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consulta de estado del microservicio
management.endpoints.web.exposure.include=health
